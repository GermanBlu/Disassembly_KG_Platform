[pytest]
testpaths = tests
markers =
    integration: needs OpenCASCADE (the 'occ' conda env) and sample STEP files; slower
    slow: long-running (e.g. detailed-solid distance); excluded from quick runs
    rag_eval: live GraphRAG eval — needs a running app + seeded Neo4j + OPENAI_API_KEY; skipped unless RAG_EVAL_BASE_URL is set
addopts = -q
